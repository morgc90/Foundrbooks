<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <!--
      Per-route <title>, meta, canonical and JSON-LD are injected at build time
      by scripts/prerender.mjs from the definitions in src/seo.js.
      Do not hardcode SEO tags here — they would apply to every route at once.
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185FA5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <noscript>
      FoundrBooks — ACA-qualified accounting for UK and Irish founders, startups and SaaS
      businesses. JavaScript is required for the AI assistant and checkout, but you can
      reach us at cashinify@gmail.com or +34 658 208 448.
    </noscript>
    <div id="root"></div>
  </body>
</html>
